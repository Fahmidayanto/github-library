    <linearGradient id="rightFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.5" />
    </linearGradient>
    <filter id="neonGlow1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
